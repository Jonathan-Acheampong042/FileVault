kind = "web"
previewPath = "/"
title = "DTCMS"
version = "1.0.0"
id = "artifacts/dtcms"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25615

[services.development]
run = "pnpm --filter @workspace/dtcms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dtcms", "run", "build" ]
serve = "static"
publicDir = "artifacts/dtcms/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25615"
BASE_PATH = "/"
